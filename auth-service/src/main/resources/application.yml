server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DB_URL:jdbc:mysql://localhost:3306/authdb}
    username: ${AUTH_DB_USER:getlink_auth}
    password: ${AUTH_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
management.endpoints.web.exposure.include: health,info
management.info.env.enabled: true
info.app:
  version: ${APP_VERSION:local}
  commit: ${GIT_COMMIT:unknown}
  build-time: ${BUILD_TIME:unknown}
getlink:
  auth:
    jwt:
      issuer: ${JWT_ISSUER:getlink_dtd}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT10M}
      secret: ${JWT_SECRET:}
    refresh:
      ttl: ${REFRESH_TOKEN_TTL:P30D}
      cookie-name: ${REFRESH_COOKIE_NAME:getlink_refresh}
      cookie-path: ${REFRESH_COOKIE_PATH:/api/v1/auth}
      cookie-secure: ${REFRESH_COOKIE_SECURE:true}
    login:
      max-failed-attempts: ${LOGIN_MAX_FAILED_ATTEMPTS:5}
      lock-duration: ${LOGIN_LOCK_DURATION:PT15M}
    password-reset:
      ttl: ${PASSWORD_RESET_TTL:PT15M}
      log-token: ${PASSWORD_RESET_LOG_TOKEN:false}
      frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
