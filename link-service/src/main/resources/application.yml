server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: link-service
  datasource:
    url: ${LINK_DB_URL:jdbc:mysql://localhost:3306/linkdb}
    username: ${LINK_DB_USER:getlink_link}
    password: ${LINK_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${MAX_AVATAR_UPLOAD_SIZE:5MB}
      max-request-size: ${MAX_AVATAR_REQUEST_SIZE:6MB}
management.endpoints.web.exposure.include: health,info
management.info.env.enabled: true
info.app:
  version: ${APP_VERSION:local}
  commit: ${GIT_COMMIT:unknown}
  build-time: ${BUILD_TIME:unknown}
getlink:
  link:
    jwt:
      issuer: ${JWT_ISSUER:getlink_dtd}
      secret: ${JWT_SECRET:}
    max-links-per-profile: ${MAX_LINKS_PER_PROFILE:30}
    avatar:
      directory: ${AVATAR_STORAGE_DIRECTORY:./data/avatars}
      max-bytes: ${MAX_AVATAR_BYTES:5242880}
