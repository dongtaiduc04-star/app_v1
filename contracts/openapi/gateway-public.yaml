openapi: 3.1.0
info:
  title: getlink_dtd Public Gateway API
  version: 0.1.0
  description: External routes exposed by the API Gateway.
servers:
  - url: /api/v1
paths:
  /system/status:
    get:
      operationId: getSystemStatus
      responses:
        '200':
          description: Sanitized service health and build metadata
  /auth/login:
    post:
      operationId: gatewayLogin
      responses:
        '200': { description: Routed to auth-service }
        '429': { description: Gateway rate limit exceeded }
  /auth/register:
    post:
      operationId: gatewayRegister
      responses:
        '201': { description: Routed to auth-service }
        '429': { description: Gateway rate limit exceeded }
  /profiles/{username}:
    get:
      operationId: gatewayPublicProfile
      parameters:
        - in: path
          name: username
          required: true
          schema: { type: string }
      responses:
        '200': { description: Routed to link-service }
        '404': { description: Profile unavailable }
  /r/{linkId}:
    get:
      operationId: gatewayLinkRedirect
      parameters:
        - in: path
          name: linkId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '302': { description: Redirect to validated stored destination }
        '429': { description: Gateway rate limit exceeded }
