server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:15s}
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**
            - id: link-service
              uri: ${LINK_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/profiles/**,/api/v1/me/**,/api/v1/r/**,/api/v1/avatars/**
management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true
info:
  app:
    version: ${APP_VERSION:local}
    commit: ${GIT_COMMIT:unknown}
    build-time: ${BUILD_TIME:unknown}
